#REMEMBER TO USE CODA_VISIBILE_DEVICES=3
name: Odisseo_0_gradient_signal
dim_flow: 7
sample_size: 64 #should be a 64x64 histogram, maybe i should adpat it to be 64x32 
dim_conditioning: 5
dim_network: 7
context_dim: 4
controlled_flow_in_dim: 10
aggregation_out_dim: 5
aggregation_in_dim: 40
start_time: 0.90
batch_size: 6
weighting: one
loss_type: flow
scaling_type: none
learning_rate: 0.0005
hidden_dims:
- 32
- 32
- 32
- 32



data:
  target: sbisim.data.benchmarks.OdisseoAllParameters
  _file: configs/datasets/benchmarks/10e5_dataset.yaml
strategy:
  target: sbisim.strategy.SimulatorFeedback
  params:
    dim_flow: ${dim_flow}
    dim_conditioning: ${dim_conditioning}
    weighting: ${weighting}
    loss_type: ${loss_type}
    scaling_type: ${scaling_type}
    start_time: ${start_time}
    time_alpha: 0.0
    prior:
      target: sbisim.strategy.distributions.get_odisseo_prior_AllParameters
    sampler:
      target: sbisim.strategy.improved_inference.FastCorrectorSampler
      params:
        num_steps: 50
        start_time: ${start_time}
    schedule:
      target: sbisim.strategy.get_paths
      params:
        paths:
          name: optimal_transport
          params:
            sigma_min: 0.0001
    model_pretrained:
      target: sbisim.flows.models.conv_2d_cross_noattention.Conv2DConditionModel
      params:
        import_samples: 10
        dim_flow: ${dim_flow}
        sample_size:  64
        in_channels:  3
        out_channels: 7
        dropout: 0.05
    weight_file_pretrained: ${weight_file_pretrained}
    model:
      target: sbisim.flows.correction.corrector.CorrectorDifferentiableSimulatorOdisseo
      params:
        simulator:
          target: sbisim.simulations.OdisseoSimulatorAllParameters
        start_time: ${start_time}

        controlled_flow:
          target: sbisim.flows.models.fmpe.DenseResidualNet
          params:
            hidden_dims: ${hidden_dims}
            out_dim: ${dim_flow}
            in_dim: ${controlled_flow_in_dim}
            activation_fn: gelu
            context_dim: ${context_dim}
        aggregation:
          target: sbisim.flows.models.fmpe.DenseResidualNet
          params:
            hidden_dims: ${hidden_dims}
            out_dim: ${aggregation_out_dim}
            in_dim: ${aggregation_in_dim}
            activation_fn: gelu
        freeze: true

training:
  num_epochs: 5
  num_steps_per_epoch: 3000
  batch_size: ${batch_size}
  early_stopping:
    patience: 2

test: 
  active: True
  tests:
    ranks:
        target: sbisim.callbacks.C2STAllParameters
        params:
          save_every: 100
          savedir: ${runtime.logdir}
          num_total_samples: 100
          observation_idx: 3_00
          batch_size: ${batch_size}

patience: 2
optimization:
  _file: configs/optimization/adam_reduce_lr.yaml

callbacks:
  checkpoint:
    target: sbisim.callbacks.checkpoint.Checkpoint
    params:
      savedir: ${runtime.logdir}
      key: val_loss
