#REMEMBER TO USE CODA_VISIBILE_DEVICES=3
name: Galax_0_gradient_signal
dim_flow: 12
dim_conditioning: 5
context_dim: 64
controlled_flow_in_dim: 46
aggregation_in_dim: 32
aggregation_out_dim: 32
start_time: 0.80
batch_size: 25
weighting: one
loss_type: fm_ot
scaling_type: none
learning_rate: 0.001
hidden_dims:
  - 64
  - 64
  - 64
  - 32
  - 32
  - 32

data:
  target: sbisim.data.benchmarks.galaxOTAllParametersPosition_uniformprior
  params:
    use_log: False
    noise: False
  _file: configs/datasets/benchmarks/10e6_dataset.yaml
  normalization: True

strategy:
  target: sbisim.strategy.SimulatorFeedback_batchnorm
  params:
    dim_flow: ${dim_flow}
    dim_conditioning: ${dim_conditioning}
    weighting: ${weighting}
    loss_type: ${loss_type}
    scaling_type: ${scaling_type}
    start_time: ${start_time}
    time_alpha: 0.0
    prior:
      target: sbisim.strategy.distributions.get_normal_gaussian_prior
      params:
        shape:
          - ${dim_flow}
    sampler:
      target: sbisim.strategy.improved_inference.FastCorrectorSampler
      params:
        num_steps: 200
        start_time: ${start_time}
    schedule:
      target: sbisim.strategy.get_paths
      params:
        paths:
          name: optimal_transport
          params:
            sigma_min: 0.0001
    model_pretrained:
      target: sbisim.flows.models.CrossAttentionSetTransformer.SetTransformerPosition_galax_uniformprior
      params:
        dim_flow: ${dim_flow}
        sample_size: 200
        N_dim: 128
        N_head: 1
        depth: 3
    weight_file_pretrained: ${weight_file_pretrained}
    model:
      target: sbisim.flows.correction.corrector.CorrectorDifferentiableSimulatorGalaxPositions_batch_norm
      params:
        simulator:
          target: sbisim.simulations.GalaxSimulatorOT_AllParametersPositions
          params:
            N_particles: 10_000
        start_time: ${start_time}
        controlled_flow:
          target: sbisim.flows.models.fmpe.DenseResidualNet
          params:
            hidden_dims: ${hidden_dims}
            out_dim: ${dim_flow}
            in_dim: ${controlled_flow_in_dim}
            activation_fn: gelu
            context_dim: ${context_dim}
        aggregation:
          target: sbisim.flows.models.fmpe.DenseResidualNet_batchnorm
          params:
            hidden_dims: ${hidden_dims}
            out_dim: ${aggregation_out_dim}
            in_dim: ${aggregation_in_dim}
            activation_fn: gelu

        freeze: true

training:
  num_epochs: 3
  num_steps_per_epoch: 300
  batch_size: ${batch_size}
  early_stopping:
    patience: 6

test:
  active: True
  tests:
    true_sampling:
      target: sbisim.callbacks.C2ST_OT_AllParametersPositions_galax_uniformprior_TrueSimulation
      params:
        savedir: ${runtime.logdir}
        num_total_samples: 2000
        batch_size: ${batch_size}

    ranks:
      target: sbisim.callbacks.c2st.C2ST_OT_AllParametersPositions_galax_uniformprior
      params:
        savedir: ${runtime.logdir}
        num_total_samples: 500
        observation_idx: 1000
        batch_size: ${batch_size}

patience: 5
optimization:
  _file: configs/optimization/adamw_reduce_lr.yaml

callbacks:
  checkpoint:
    target: sbisim.callbacks.checkpoint.Checkpoint
    params:
      savedir: ${runtime.logdir}
      key: val_loss
