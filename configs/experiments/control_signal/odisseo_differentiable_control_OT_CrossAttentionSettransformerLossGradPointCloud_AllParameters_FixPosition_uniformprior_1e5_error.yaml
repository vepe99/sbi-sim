#REMEMBER TO USE CODA_VISIBILE_DEVICES=3
name: Odisseo_0_gradient_signal
dim_flow: 7
dim_conditioning: 32
start_time: 0.90
batch_size: 500
weighting: one
loss_type: fm_ot
scaling_type: none
learning_rate: 0.001
aggregation_out_dim: 32
aggregation_in_dim: 40
hidden_dims:
  - 128
  - 128
  - 64
  - 64
  - 32
  - 32

data:
  target: sbisim.data.benchmarks.OdisseoOTAllParametersFiXPosition_uniformprior_TSIT5_error
  _file: configs/datasets/benchmarks/10e5_dataset.yaml
strategy:
  target: sbisim.strategy.SimulatorFeedback
  params:
    dim_flow: ${dim_flow}
    dim_conditioning: ${dim_conditioning}
    weighting: ${weighting}
    loss_type: ${loss_type}
    scaling_type: ${scaling_type}
    start_time: ${start_time}
    time_alpha: 0.0
    prior:
      target: sbisim.strategy.distributions.get_normal_gaussian_prior
      params:
        shape:
          - ${dim_flow}
    sampler:
      target: sbisim.strategy.improved_inference.FastCorrectorSampler
      params:
        num_steps: 200
        start_time: ${start_time}
    schedule:
      target: sbisim.strategy.get_paths
      params:
        paths:
          name: optimal_transport
          params:
            sigma_min: 0.0001
    model_pretrained:
      target: sbisim.flows.models.CrossAttentionSetTransformer.SetTransformerPosition_uniformprior
      params:
        dim_flow: ${dim_flow}
        sample_size: 1000
        N_dim: 128
        N_head: 1
        depth: 2
    weight_file_pretrained: ${weight_file_pretrained}
    model:
      target: sbisim.flows.correction.corrector.CorrectorDifferentiableSimulatorOdisseo_fixposition_orbit_fitting_andpointcloud
      params:
        simulator:
          target: sbisim.simulations.OdisseoSimulatorOT_AllParameters_FixPosition_orbitfitting_pointcloud_TSIT5
          params:
            N_particles: 100
        start_time: ${start_time}

        controlled_flow:
          target: sbisim.flows.models.CrossAttentionSetTransformer_simfeedback.SetTransformerPosition_fixposition_uniformprior_lossgrad_pointcloudTSIT5
          params:
            dim_flow: ${dim_flow}
            sample_size: 100
            N_dim: 32
            N_head: 1
            depth: 3
        aggregation:
          target: sbisim.flows.models.fmpe.Identity
        freeze: true

training:
  num_epochs: 50
  num_steps_per_epoch: 2000
  batch_size: ${batch_size}
  early_stopping:
    patience: 10

test:
  active: True
  tests:
    true_sampling:
      target: sbisim.callbacks.c2st.C2ST_OT_AllParametersFixPositions_uniformprior_TrueSimulation
      params:
        savedir: ${runtime.logdir}
        num_total_samples: 5000
        batch_size: ${batch_size}
    ranks:
      target: sbisim.callbacks.C2ST_OT_AllParametersFixPositions_uniformprior
      params:
        save_every: 200
        savedir: ${runtime.logdir}
        num_total_samples: 100
        observation_idx: 100
        batch_size: ${batch_size}

patience: 5
optimization:
  _file: configs/optimization/adamw_reduce_lr.yaml

callbacks:
  checkpoint:
    target: sbisim.callbacks.checkpoint.Checkpoint
    params:
      savedir: ${runtime.logdir}
      key: val_loss
