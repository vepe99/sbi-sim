#REMEMBER TO USE CODA_VISIBILE_DEVICES=3
name: Odisseo_0_gradient_signal
dim_flow: 13
sample_size: 64 #should be a 64x64 histogram, maybe i should adpat it to be 64x32 
dim_conditioning: 5
dim_network: 7
context_dim: 64
controlled_flow_in_dim: 32
aggregation_out_dim: 32
aggregation_in_dim: 40
start_time: 0.90
batch_size: 13
weighting: one
loss_type: fm_ot
scaling_type: none
learning_rate: 0.00005
hidden_dims:
- 256
- 256
- 256
- 128
- 128
- 128
- 128
- 64
- 64
- 64
- 64



data:
  target: sbisim.data.benchmarks.OdisseoOTAllParametersPosition
  _file: configs/datasets/benchmarks/10e5_dataset.yaml
strategy:
  target: sbisim.strategy.SimulatorFeedback
  params:
    dim_flow: ${dim_flow}
    dim_conditioning: ${dim_conditioning}
    weighting: ${weighting}
    loss_type: ${loss_type}
    scaling_type: ${scaling_type}
    start_time: ${start_time}
    time_alpha: 0.0
    prior:
      target: sbisim.strategy.distributions.get_normal_gaussian_prior
      params:
        shape:
         - ${dim_flow}
    sampler:
      target: sbisim.strategy.improved_inference.FastCorrectorSampler
      params:
        num_steps: 50
        start_time: ${start_time}
    schedule:
      target: sbisim.strategy.get_paths
      params:
        paths:
          name: optimal_transport
          params:
            sigma_min: 0.001
    model_pretrained:
      target: sbisim.flows.models.SetTransformer.SetTransformer
      params:
        import_samples: 10
        dim_flow: ${dim_flow}
        sample_size: 1000
        N_dim: 64
        N_head: 4
        depth: 2
    weight_file_pretrained: ${weight_file_pretrained}
    model:
      target: sbisim.flows.correction.corrector.CorrectorDifferentiableSimulatorOdisseoAggregationNormalizedNewLoss_transformfirst
      params:
        simulator:
          target: sbisim.simulations.OdisseoSimulatorOT_AllParametersPosition_newprior
        start_time: ${start_time}

      controlled_flow:
          target: sbisim.flows.models.fmpe.ThetaContextTransformer
          params:
            embed_dim: 128
            num_heads: 8
      aggregation:
          target: sbisim.flows.models.fmpe.Identity
          params:
      freeze: true

training:
  num_epochs: 60
  num_steps_per_epoch: 2000
  batch_size: ${batch_size}
  early_stopping:
    patience: 20

test: 
  active: True
  tests:
    ranks:
        target: sbisim.callbacks.C2ST_OT_AllParameters
        params:
          save_every: 200
          savedir: ${runtime.logdir}
          num_total_samples: 100
          observation_idx: 200
          batch_size: ${batch_size}
    true_sampling:
        target: sbisim.callbacks.c2st.C2ST_OT_AllParameters_TrueSimulation
        params:
          savedir: ${runtime.logdir}
          num_total_samples: 5000
          batch_size: ${batch_size}

patience: 2
optimization:
  _file: configs/optimization/adamw_reduce_lr.yaml

callbacks:
  checkpoint:
    target: sbisim.callbacks.checkpoint.Checkpoint
    params:
      savedir: ${runtime.logdir}
      key: val_loss
