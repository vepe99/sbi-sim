#REMEMBER TO USE CODA_VISIBILE_DEVICES=3
name: Odisseo_0_gradient_signal
dim_flow: 13
sample_size: 64 #should be a 64x64 histogram, maybe i should adpat it to be 64x32 
dim_conditioning: 5
dim_network: 7
context_dim: 64
controlled_flow_in_dim: 10
aggregation_out_dim: 5
aggregation_in_dim: 40
start_time: 0.80
batch_size: 13
weighting: one
loss_type: fm_ot
scaling_type: none
learning_rate: 0.0001
hidden_dims:
- 64
- 64
- 64
- 32
- 32
- 32



data:
  target: sbisim.data.benchmarks.OdisseoOTAllParametersPosition
  _file: configs/datasets/benchmarks/10e5_dataset.yaml
strategy:
  target: sbisim.strategy.SimulatorFeedback
  params:
    dim_flow: ${dim_flow}
    dim_conditioning: ${dim_conditioning}
    weighting: ${weighting}
    loss_type: ${loss_type}
    scaling_type: ${scaling_type}
    start_time: ${start_time}
    time_alpha: 0.0
    prior:
      target: sbisim.strategy.distributions.get_normal_gaussian_prior
      params:
        shape:
         - ${dim_flow}
    sampler:
      target: sbisim.strategy.improved_inference.FastCorrectorSampler
      params:
        num_steps: 200
        start_time: ${start_time}
    schedule:
      target: sbisim.strategy.get_paths
      params:
        paths:
          name: optimal_transport
          params:
            sigma_min: 0.0001
    model_pretrained:
      target: sbisim.flows.models.SetTransformer.SetTransformerPosition
      params:
        import_samples: 10
        dim_flow: ${dim_flow}
        sample_size: 1000
        N_dim: 64
        N_head: 8
        depth: 2
    weight_file_pretrained: ${weight_file_pretrained}
    model:
      target: sbisim.flows.correction.corrector.CorrectorDifferentiableSimulatorOdisseoAggregationNewLoss
      params:
        simulator:
          target: sbisim.simulations.OdisseoSimulatorOT_AllParametersPosition
        start_time: ${start_time}

        controlled_flow:
          target: sbisim.flows.models.fmpe.DenseResidualNet
          params:
            hidden_dims: ${hidden_dims}
            out_dim: ${dim_flow}
            in_dim: ${controlled_flow_in_dim}
            activation_fn: gelu
            context_dim: ${context_dim}
        aggregation:
          target: sbisim.flows.models.fmpe.DenseResidualNet
          params:
            hidden_dims: ${hidden_dims}
            out_dim: ${aggregation_out_dim}
            in_dim: ${aggregation_in_dim}
            activation_fn: gelu
        freeze: true

training:
  num_epochs: 10
  num_steps_per_epoch: 3000
  batch_size: ${batch_size}
  early_stopping:
    patience: 2

test: 
  active: True
  tests:
    ranks:
        target: sbisim.callbacks.C2ST_OT_AllParametersPositions
        params:
          save_every: 200
          savedir: ${runtime.logdir}
          num_total_samples: 100
          observation_idx: 200
          batch_size: ${batch_size}
    true_sampling:
        target: sbisim.callbacks.c2st.C2ST_OT_AllParametersPositions_TrueSimulation
        params:
          savedir: ${runtime.logdir}
          num_total_samples: 5000
          batch_size: ${batch_size}
patience: 2
optimization:
  _file: configs/optimization/adam_reduce_lr.yaml

callbacks:
  checkpoint:
    target: sbisim.callbacks.checkpoint.Checkpoint
    params:
      savedir: ${runtime.logdir}
      key: val_loss
