name: Odisseo_0_gradient_signal
dim_flow: 4
sample_size: 64 #should be a 64x64 histogram, maybe i should adpat it to be 64x32 
dim_conditioning: 5
dim_network: 4
context_dim: 16
controlled_flow_in_dim: 10
aggregation_out_dim: 5
aggregation_in_dim: 40
start_time: 0.8
batch_size: 1
weighting: one
loss_type: fm_ot
scaling_type: none
learning_rate: 0.001
hidden_dims:
- 32
- 64
- 128
- 256
- 512
- 512
- 512
- 512
- 512
- 256
- 128
- 64
- 32

data:
  target: sbisim.data.benchmarks.Odisseo
  _file: configs/datasets/benchmarks/10e3_dataset.yaml
strategy:
  target: sbisim.strategy.SimulatorFeedback
  params:
    dim_flow: ${dim_flow}
    dim_conditioning: ${dim_conditioning}
    weighting: ${weighting}
    loss_type: ${loss_type}
    scaling_type: ${scaling_type}
    start_time: ${start_time}
    time_alpha: 0.0
    prior:
      target: sbisim.strategy.distributions.get_normal_gaussian_prior
      params:
        shape:
        - 4
    sampler:
      target: sbisim.strategy.improved_inference.FastCorrectorSampler
      params:
        num_steps: 200
        start_time: ${start_time}
    schedule:
      target: sbisim.strategy.get_paths
      params:
        paths:
          name: optimal_transport
          params:
            sigma_min: 0.0001
    model_pretrained:
      target: sbisim.flows.models.conv_2d_cross_attention.Conv2DConditionModel
      params:
        import_samples: 5 
        dim_flow: ${dim_flow}
        sample_size:  64
        in_channels:  3
        out_channels: 10
    weight_file_pretrained: ${weight_file_pretrained}
    model:
      target: sbisim.flows.correction.corrector.CorrectorDifferentiableSimulatorOdisseo
      params:
        simulator:
          target: sbisim.simulations.OdisseoSimulator
        start_time: ${start_time}
        controlled_flow:
          target: sbisim.flows.models.conv_2d_cross_attention.Conv2DConditionModel
          params:
            import_samples: 5 
            dim_flow: ${dim_flow}
            sample_size:  32
            in_channels:  3
            out_channels: 10
        aggregation:
          target: sbisim.flows.models.conv_2d_cross_attention.Conv2DConditionModel
          params:
            import_samples: 5 
            dim_flow: ${dim_flow}
            sample_size:  32
            in_channels:  3
            out_channels: 10
        freeze: true

training:
  num_epochs: 5
  num_steps_per_epoch: 2000
  batch_size: ${batch_size}
  early_stopping:
    patience: 50

# test:
#   active: True
#   tests:
#     c2st:
#       target: sbisim.callbacks.C2ST

patience: 6
optimization:
  _file: configs/optimization/adam_reduce_lr.yaml

callbacks:
  checkpoint:
    target: sbisim.callbacks.checkpoint.Checkpoint
    params:
      savedir: ${runtime.logdir}
      key: val_loss
  # scatter:
  #   target: sbisim.callbacks.BenchmarkScatterPlot
  #   params:
  #     save_every: 25
  #     savedir: ${runtime.logdir}
