name: Odisseo_0_gradient_signal

dim_flow: 4
dim_conditioning: 5
dim_network: 4

batch_size: 256

weighting: 'one'
loss_type: 'fm_ot'
scaling_type: 'none'

learning_rate: 0.001

data:
  target: sbisim.data.benchmarks.Odisseo
  _file: configs/datasets/benchmarks/10e5_dataset.yaml
  normalization : True

strategy:
  target: sbisim.strategy.ConditionalFlowMatching
  params:
    dim_flow: ${dim_flow}
    dim_conditioning: ${dim_conditioning}
    weighting: ${weighting}
    loss_type: ${loss_type}
    scaling_type: ${scaling_type}
    time_alpha: 1
    bandwidth: 0.01
    prior:
      target: sbisim.strategy.distributions.get_odisseo_prior
    sampler:
      target: sbisim.strategy.improved_inference.PriorODESolver
      params:
        prior:
          target: sbisim.strategy.distributions.get_odisseo_prior
        solver_name: euler
        init_stepsize: 0.01
    schedule:
        target: sbisim.strategy.get_paths
        params:
          paths:
            name: optimal_transport
            params:
              sigma_min: 1e-4
    model:
      target: sbisim.flows.models.conv_2d_cross_attention.Conv2DConditionModel
      params:
        import_samples: 10
        dim_flow: ${dim_flow}
        sample_size:  64
        in_channels:  3
        out_channels: 32
        dropout: 0.4
        # layers_per_block: 2
      # target: sbisim.flows.models.fmpe.ConvolutionalEmbeddingNet
      # params:
      #   out_channels: 10


training:
  num_epochs: 200
  num_steps_per_epoch: 5000
  batch_size: ${batch_size}
  early_stopping:
    patience: 50

# test:
#   active: True
#   tests:
#     c2st:
#       target: sbisim.callbacks.C2ST

patience: 3
optimization:
  _file: configs/optimization/adam_reduce_lr.yaml

callbacks:
  checkpoint:
    target: sbisim.callbacks.checkpoint.Checkpoint
    params:
      savedir: ${runtime.logdir}
      key: val_loss
  scatter:
    target: sbisim.callbacks.corner_plot_posterior
    params:
      save_every: 30
      savedir: ${runtime.logdir}