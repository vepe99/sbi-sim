#REMEMBER TO USE CODA_VISIBILE_DEVICES=3
name: Odisseo_0_gradient_signal

dim_flow: 13
dim_conditioning: 5
dim_network: 4

batch_size: 100

weighting: "one"
loss_type: "fm_ot"
scaling_type: "none"

learning_rate: 0.001

data:
  target: sbisim.data.benchmarks.OdisseoOTAllParametersPosition_uniformprior_TSIT5_error
  _file: configs/datasets/benchmarks/20e5_dataset.yaml
  normalization: True

strategy:
  target: sbisim.strategy.ConditionalFlowMatching
  params:
    dim_flow: ${dim_flow}
    dim_conditioning: ${dim_conditioning}
    weighting: ${weighting}
    loss_type: ${loss_type}
    scaling_type: ${scaling_type}
    time_alpha: 1
    bandwidth: 0.01
    prior:
      target: sbisim.strategy.distributions.get_normal_gaussian_prior
      params:
        shape:
          - ${dim_flow}
    sampler:
      target: sbisim.strategy.improved_inference.PriorODESolver
      params:
        prior:
          target: sbisim.strategy.distributions.get_normal_gaussian_prior
          params:
            shape:
              - ${dim_flow}
        solver_name: euler
        init_stepsize: 0.01
    schedule:
      target: sbisim.strategy.get_paths
      params:
        paths:
          name: optimal_transport
          params:
            sigma_min: 1e-4
    model:
      target: sbisim.flows.models.CrossAttentionSetTransformer.SetTransformerPosition_uniformprior_TSIT5
      params:
        dim_flow: ${dim_flow}
        sample_size: 1000
        N_dim: 128
        N_head: 8
        depth: 6

training:
  num_epochs: 500
  num_steps_per_epoch: 6000
  batch_size: ${batch_size}
  early_stopping:
    patience: 30

test:
  active: True
  tests:
    true_sampling:
      target: sbisim.callbacks.c2st.C2ST_OT_AllParametersPositions_uniformprior_TrueSimulation
      params:
        savedir: ${runtime.logdir}
        num_total_samples: 5000
        batch_size: ${batch_size}
    ranks:
      target: sbisim.callbacks.C2ST_OT_AllParametersPositions_uniformprior
      params:
        save_every: 200
        savedir: ${runtime.logdir}
        num_total_samples: 500
        observation_idx: 500
        batch_size: ${batch_size}

patience: 5
optimization:
  _file: configs/optimization/adamw_reduce_lr.yaml

callbacks:
  checkpoint:
    target: sbisim.callbacks.checkpoint.Checkpoint
    params:
      savedir: ${runtime.logdir}
      key: val_loss
